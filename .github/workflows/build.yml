name: Build Mustafa Rider & Keygen APKs

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-mustafa-rider:
    runs-on: ubuntu-latest

    steps:
      # 1. تنزيل الكود المصدري والمكتبات الفرعية
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 2. إعداد بيئة Java JDK 17
      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. إعداد بيئة Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 4. تثبيت مكتبات Python
      - name: Install Python Libraries
        run: pip install cryptography Pillow pyyaml

      # 5. مزامنة وتنزيل مكتبة Dobby (C++ Hook) وتحديث مستودعات Gradle الرسمية
      - name: Sync Submodules & Download Dobby Library
        run: |
          git submodule sync --recursive || true
          git submodule update --init --recursive --force || true
          if [ ! -f "app/src/main/cpp/third_party/Dobby/CMakeLists.txt" ]; then
            echo "Dobby submodule directory is empty; cloning Dobby directly..."
            rm -rf app/src/main/cpp/third_party/Dobby
            mkdir -p app/src/main/cpp/third_party
            git clone --depth 1 --recurse-submodules https://github.com/jmpews/Dobby.git app/src/main/cpp/third_party/Dobby
          fi
          ls -la app/src/main/cpp/third_party/Dobby/CMakeLists.txt
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's|https://mirrors.cloud.tencent.com/gradle/|https://services.gradle.org/distributions/|g' gradle/wrapper/gradle-wrapper.properties
          fi

      # 6. حقن وتجهيز ملفات Mustafa Rider ونظام الترخيص وموديول Mustafa Keygen بالكامل
