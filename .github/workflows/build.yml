name: Build Mustafa Rider & Keygen APKs

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-mustafa-rider:
    runs-on: ubuntu-latest

    steps:
      # 1. تنزيل الكود المصدري والمكتبات الفرعية
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 2. إعداد بيئة Java JDK 17
      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. إعداد بيئة Python لمعالجة الأيقونة والتحقق من الهوية
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 4. تثبيت مكتبات Python
      - name: Install Python Libraries
        run: pip install cryptography Pillow pyyaml

      # 5. مزامنة المكتبات الفرعية (Dobby) وتحديث مستودعات Gradle الرسمية
      - name: Sync Submodules & Configure Repositories
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force
          git submodule foreach --recursive git reset --hard
          git submodule foreach --recursive git clean -fdx
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i 's|https://maven.aliyun.com/repository/google|https://dl.google.com/dl/android/maven2|g' {} +
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i 's|https://maven.aliyun.com/repository/public|https://repo1.maven.org/maven2|g' {} +
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i 's|https://maven.aliyun.com/repository/jcenter|https://repo1.maven.org/maven2|g' {} +
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i 's|https://maven.aliyun.com/[^'\''"]*|https://repo1.maven.org/maven2|g' {} +

      # 6. توليد أيقونة وشعار Mustafa Rider من ملف icon.jpg للتطبيق الرئيسي وتطبيق Keygen
      - name: Generate Mustafa Rider & Keygen Icons from icon.jpg
        run: |
          python3 - << 'PYEOF'
          import os, glob, shutil
          from PIL import Image, ImageDraw

          def make_round(img, size):
              resized = img.resize((size, size), Image.Resampling.LANCZOS)
              mask = Image.new('L', (size, size), 0)
              draw = ImageDraw.Draw(mask)
              draw.ellipse((0, 0, size - 1, size - 1), fill=255)
              out = Image.new('RGBA', (size, size), (0, 0, 0, 0))
              out.paste(resized, (0, 0), mask)
              return out

          img_file = 'icon.jpg'
          if not os.path.exists(img_file):
              for f in sorted(os.listdir('.')):
                  if f.lower().endswith(('.png', '.jpg', '.jpeg')) and not f.startswith('.'):
                      img_file = f
                      break

          if os.path.exists(img_file):
              im = Image.open(img_file).convert('RGBA')
              for mod in ['app', 'keygen']:
                  res_dir = f'{mod}/src/main/res'
                  if not os.path.exists(res_dir):
                      continue
                  for f in glob.glob(f'{res_dir}/mipmap*/*launcher*'):
                      try: os.remove(f)
                      except Exception: pass
                  if os.path.exists(f'{res_dir}/mipmap-anydpi-v26'):
                      shutil.rmtree(f'{res_dir}/mipmap-anydpi-v26', ignore_errors=True)
                  os.makedirs(f'{res_dir}/drawable', exist_ok=True)
                  im.resize((512, 512), Image.Resampling.LANCZOS).save(f'{res_dir}/drawable/app_logo.png')
                  densities = {
                      'mipmap-mdpi': 48,
                      'mipmap-hdpi': 72,
                      'mipmap-xhdpi': 96,
                      'mipmap-xxhdpi': 144,
                      'mipmap-xxxhdpi': 192
                  }
                  for folder, sz in densities.items():
                      dest = os.path.join(res_dir, folder)
                      os.makedirs(dest, exist_ok=True)
                      im.resize((sz, sz), Image.Resampling.LANCZOS).save(os.path.join(dest, 'ic_launcher.png'))
                      make_round(im, sz).save(os.path.join(dest, 'ic_launcher_round.png'))
              print("Mustafa Rider & Keygen icons generated from", img_file)
          PYEOF

      # 7. التأكد من حصر اللغات في العربية والإنجليزية وحقوق Mustafa فقط
      - name: Verify Mustafa Branding & Arabic/English Locales
        run: |
          rm -rf app/src/main/res/values-zh* README_zh.md .github/workflows/telegram-release.yml
          cat << 'EOF' >> app/proguard-rules.pro
          -dontwarn de.robv.android.xposed.**
          -dontwarn io.github.zensu357.**
          -dontwarn **
          -keepclasseswithmembernames class * {
              native <methods>;
          }
          -keep class io.github.zensu357.camswap.ActivationActivity { *; }
          -keep class io.github.zensu357.camswap.LicenseManager { *; }
          EOF

      # 8. إنشاء شهادة التوقيع الرسمية باسم Mustafa وتفعيلها في Gradle
      - name: Configure Automatic Release Signing for Mustafa Rider & Keygen
        run: |
          mkdir -p app
          rm -f app/release.keystore
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -alias release_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "pass123456" \
            -keypass "pass123456" \
            -dname "CN=MustafaRider, OU=Mustafa, O=Mustafa, C=SA"

          cat << 'EOF' > local.properties
          storeFile=app/release.keystore
          storePassword=pass123456
          keyAlias=release_key
          keyPassword=pass123456
          EOF

      # 9. بناء وتوقيع تطبيق Mustafa Rider وتطبيق Mustafa Keygen
      - name: Build Mustafa Rider & Mustafa Keygen Release APKs
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :keygen:assembleRelease -x lint -x lintVitalRelease -x test --stacktrace --no-daemon 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo "## ❌ تفاصيل خطأ التجميع:" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            grep -B 2 -A 35 "FAILURE: Build failed with an exception." build_log.txt >> $GITHUB_STEP_SUMMARY || tail -n 60 build_log.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $EXIT_CODE
          fi

      # 10. تجميع وتسمية ملفات الـ APK النهائية
      - name: Organize Output APKs
        run: |
          mkdir -p dist
          for f in $(find app/build/outputs/apk/release -name "*.apk"); do
            base=$(basename "$f" | sed 's/app-/Mustafa-Rider-/g')
            cp "$f" "dist/$base"
          done
          for f in $(find keygen/build/outputs/apk/release -name "*.apk"); do
            cp "$f" "dist/Mustafa-Keygen.apk"
          done
          echo "=== ملفات الـ APK الجاهزة ==="
          ls -lh dist/

      # 11. رفع تطبيق Mustafa Rider كـ Artifact
      - name: Upload Mustafa Rider APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mustafa-Rider-Release-APK
          path: dist/Mustafa-Rider-*.apk
          if-no-files-found: error

      # 12. رفع تطبيق Mustafa Keygen كـ Artifact مستقل
      - name: Upload Mustafa Keygen APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mustafa-Keygen-APK
          path: dist/Mustafa-Keygen.apk
          if-no-files-found: error

      # 13. نشر الإصدار في GitHub Releases مع كافة ملفات الـ APK
      - name: Create GitHub Release and Upload APKs
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Mustafa Rider & Keygen v1.0.${{ github.run_number }}"
          body: |
            ### 🚀 إصدار رسمي: Mustafa Rider & Mustafa Keygen
            - **اسم التطبيق:** `Mustafa Rider`
            - **الحقوق والملكية:** جميع الحقوق محفوظة © **Mustafa**
            - **اللغات المدعومة:** العربية والإنجليزية فقط (`AR / EN`)
            - **التواصل وشراء التراخيص (WhatsApp):** `+966557917803` (`HI i need buy key`)
            - **الملفات المرفقة:**
              1. `Mustafa-Rider-*.apk` — التطبيق الرئيسي المحمي بنظام ترخيص Mustafa.
              2. `Mustafa-Keygen.apk` — تطبيق مولد المفاتيح الخاص بإدارة تراخيص Mustafa Rider.
          draft: false
          prerelease: false
          files: |
            dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 14. ملخص عملية البناء
      - name: Build Summary
        run: |
          echo "## ✅ تم بناء وتوقيع Mustafa Rider و Mustafa Keygen بنجاح" >> $GITHUB_STEP_SUMMARY
          echo "- **التطبيق الرئيسي:** \`Mustafa Rider\` (\`mustafa.rider\`)" >> $GITHUB_STEP_SUMMARY
          echo "- **تطبيق مولد المفاتيح:** \`Mustafa Keygen\` (\`mustafa.rider.keygen\`)" >> $GITHUB_STEP_SUMMARY
          echo "- **الحقوق:** © Mustafa — جميع الحقوق محفوظة" >> $GITHUB_STEP_SUMMARY
          echo "- **واتساب التراخيص:** \`+966557917803\` (\`HI i need buy key\`)" >> $GITHUB_STEP_SUMMARY
